<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel = "stylesheet" href="styles.css">
   <script src="scriptacademic.js" defer></script>
  <title>Academic-Request</title>
</head>
<body>

  <header class = "site-header">
    <div class = "page-container">
      <h1>Academic Advising</h1>
      <p>Submit a request for an advising appointment</p>
    </div>
  </header>

  <main class = "page-container">
    <section class = "intro-section">
      <h2>Before You Submit</h2>
      <p>Please have your student ID, reason for visit, specific academic advisor, and date/time prepared</p>
    </section>

    <section>
      <h2>Appointment Details</h2>

      <form method="get" id="transaction-form.html">
        <fieldset>
          <legend>Advising Information</legend>
          <div class = "form-row">

            <div class = "form-group"> 
              <label for="studentName">Student Name</label>
              <input
                id="studentName"
                name="studentName"
                type="text"
                required>
            </div>

            <div class = "form-group">
              <label for="studentId">Student ID</label>
              <input
                id="studentId"
                name="studentId"
                type="text"
                inputmode="numeric"
                pattern="[0-9]{7}"
                maxlength="7"
                required>

              <p id="validstudentId" aria-live="polite"></p> 
               
            </div>
            
          </div>
              

            <div class = "form-row">
              
              <div class = "form-group">
                <label for="advisingDate">Advising Date</label>
                <input
                  id="advisingDate"
                  name="advisingDate"
                  type="date"
                  required>
              </div>

              <div class = "form-group">
                <label for="advisingTime">Advising Time</label>
                <input
                  id="advisingTime"
                  name="advisingTime"
                  type="time"
                  required>
                <!--I will work on refining the time portion, wanted to have something for now.-->
              </div>

              <div class = "form-group">
              <label for="appointmentType">Appointment Type</label>
              <select
                id="appointmentType"
                name="appointmentType"
                required>

                <option value="">Select an appointment type</option>
                <option value="virtual">Virtual</option>
                <option value="in-person">In-Person</option>
              </select>
              </div>
            </div>


          <div class = "form-row">

            <div class = "form-group">
              <label for="advisorName">Advisor Name</label>
              <select
                id="advisorName"
                name="advisorName"
                required>

                <option value="">Select an advisor</option>
                <option value="advisor1">Rima Attar (Supply Chain Management)</option>
                <option value="advisor2">Erica Mahan (Management) </option>
                <option value="advisor3">Asha Thomas (Entrepreneurship)</option>
                <option value="advisor4">Kishwar Kabiruddin (Marketing)</option>
                <option value="advisor5">Other </option>
                <!--Idk what names you guys want so I just put random stuff-->
              </select>
            </div>

            <div class = "form-group">
              <label for="gradeStanding">Grade Standing</label>
              <select
                id="gradeStanding"
                name="gradeStanding"
                required>

                <option value="">What is your grade standing?</option>
                <option value="freshman">Freshman</option>
                <option value="sophomore">Sophomore</option>
                <option value="junior">Junior</option>
                <option value="senior">Senior</option>
              </select>
            </div>
          </div>

          <div class = "form-group">
            <label for="description">Appointment Purpose / Description</label>
            <textarea
              id="description"
              name="description"
              rows="4"
              cols="45"
              required></textarea>
          </div>
        </fieldset>

        <button type="submit">Submit Request</button>
      </form>
    </section>
  </main>
</body>
</html>
